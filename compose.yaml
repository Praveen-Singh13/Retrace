name: retrace-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retrace_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-only}
      POSTGRES_DB: postgres
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --disableTelemetry
    ports:
      - "127.0.0.1:${AZURITE_BLOB_HOST_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data

  local-vault:
    build:
      context: ./infra/local/local-vault
    ports:
      - "127.0.0.1:${LOCAL_VAULT_HOST_PORT:-8200}:8200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8200/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  azurite_data:
