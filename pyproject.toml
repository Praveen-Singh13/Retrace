[project]
name = "retrace-workspace"
version = "0.1.0"
description = "Retrace monorepo Python workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.14,<0.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/core", "services/ai"]
